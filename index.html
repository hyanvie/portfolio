<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yanvie 的前端网页作品集</title>
  <style>
    /* ===== 基础样式 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f7f6f4;
      color: #2b2b2b;
      padding: 48px 20px;
    }

    /* ===== 页面标题 ===== */
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 36px; color: #e8664a; }
    header p  { margin-top: 12px; color: #666; }

    /* ===== 卡片网格：自动适配屏幕宽度 ===== */
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .card {
      display: block;              /* 整张卡片都是一个链接 */
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }
    .card:focus-visible { outline: 3px solid #e8664a; }

    /* 截图区域：固定比例，图片裁剪填满 */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top;
      display: block;
      background: #eee;            /* 图片没加载出来时的底色 */
    }

    .card-body { padding: 20px; }
    .card-body h2 { font-size: 20px; margin-bottom: 12px; }

    .tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: #f9b4a4;
      color: #7a2a1a;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Yanvie 的前端网页作品集</h1>
    <p>这是我的前端网页作品，点击跳转到具体的页面！</p>
  </header>

  <main class="grid">

    <!-- 作品 1：把 href 换成你部署后的网址，把 src 换成你的截图 -->
    <a class="card" href="https://quiz-game-vert-alpha.vercel.app/" target="_blank" rel="noopener">
      <img src="images/quiz.png" alt="Quiz Time 作品截图">
      <div class="card-body">
        <h2>Quiz Time</h2>
        <span class="tag">Quiz</span>
      </div>
    </a>

    <!-- 作品 2 -->
    <a class="card" href="https://register-page-roan.vercel.app" target="_blank" rel="noopener">
      <img src="images/register.png" alt="Register Form 作品截图">
      <div class="card-body">
        <h2>Register Form</h2>
        <span class="tag">Register</span>
      </div>
    </a>

    <!-- 作品 3 -->
    <a class="card" href="https://menu-search-lilac.vercel.app/" target="_blank" rel="noopener">
      <img src="images/recipe.png" alt="Recipe Finder 作品截图">
      <div class="card-body">
        <h2>Recipe Finder</h2>
        <span class="tag">Recipe</span>
      </div>
    </a>

  </main>

</body>
</html>
